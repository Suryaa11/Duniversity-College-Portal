apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: mysql-stateful
  namespace: fitness-ns
spec:
  replicas: 3
  minReadySeconds: 10
  selector:
    matchLabels:
      app: mysql
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1
      maxSurge: 1
  template:
    metadata:
      labels:
        app: mysql
    spec:
      terminationGracePeriodSeconds: 10
      containers:
        - name: mysql-cont
          image: mysql
          ports:
            - containerPort: 3306
          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              cpu: "200m"
              memory: "512Mi"
          envFrom:
            - configMapRef:
                name: university-config
            - secretRef:
                name: university-secret
          #env:
            # - name: MYSQL_ROOT_PASSWORD
            #   valueFrom:
            #     secretKeyRef:
            #       name: university-secret
            #       key: MYSQL_ROOT_PASSWORD
            # - name: DB_USER
            #   valueFrom:
            #     secretKeyRef:
            #       name: university-secret
            #       key: DB_USER
            # - name: DB_PASSWORD
            #   valueFrom:
            #     secretKeyRef:
            #       name: university-secret
            #       key:  DB_PASSWORD
            # - name: DB_HOST
            #   valueFrom:
            #     configMapKeyRef:
            #       name: university-config
            #       key: DB_HOST
            # - name: DB_PORT
            #   valueFrom:
            #     configMapKeyRef:
            #       name: university-config
            #       key: DB_PORT
          volumeMounts:
            - name: mysql-volume
              mountPath: /var/lib/mysql
            - name: mysql-init
              mountPath: /docker-entrypoint-initdb.d
      volumes:
        - name: mysql-init
          configMap:
            name: mysql-config
  volumeClaimPath:
    - metadata:
        name: mysql-volume
      spec:
        accessModes: ["ReadWriteMany"]
        storageClassName: university-storage
        resources:
          requests:
            storage: 5Gi
          
---
apiVersion: v1
kind: Service
metadata:
  name: mysql-service
  namespace: fitness-ns
spec:
  selector:
    app: mysql
  ports:
    - port: 3306
      targetPort: 3306
  ClusterIP: None

