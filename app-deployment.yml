apiVersion: apps/v1
kind: Deployment
metadata: 
  name: university-deploy
  namespace: fitness-ns
spec:
  replicas: 3
  strategy:
    type: RollingUpdate
    rollingUpdate: 
      maxUnavailable: 1
      maxSurge: 1
  selector:
    matchLabels:
      app: university
  template:
    metadata:
      labels:
        app: university
    spec:
      containers:
        - name: university-cont
          image: suryaa112003/duniversity:v1.1.0
          ports:
            - containerPort: 3000
          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              cpu: "200m"
              memory: "512Mi"
---
apiVersion: v1
kind: Service
metadata:
  name: university-service
  namespace: fitness-ns
spec:
  selector:
    app: university
  ports:
    - port: 3001
      targetPort: 3000
  type: NodePort